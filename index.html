<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>passphrase</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🔑</text></svg>">
<style>
:root {
    --bg: #0a0a14;
    --surface: #16162a;
    --accent: #ff6b35;
    --accent-light: #ff8c42;
    --accent-dark: #d94f1a;
    --accent-glow: rgba(255, 107, 53, 0.15);
    --accent-subtle: rgba(255, 107, 53, 0.06);
    --text: #f0ece4;
    --text-dim: #8a8a9a;
    --text-muted: #5a5a6e;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 16px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: "SF Mono", "Fira Code", "Cascadia Code", ui-monospace, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.container {
    width: 100%;
    max-width: 680px;
    padding: 2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
}
header { text-align: center; margin-bottom: 2rem; }
h1 {
    text-transform: uppercase;
    letter-spacing: 0.35em;
    font-weight: 200;
    opacity: 0.5;
    font-size: 1.5rem;
}
.tagline { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.3rem; }
.card {
    background: var(--surface);
    border: 1px solid var(--text-muted);
    border-radius: var(--radius-lg);
    padding: 2rem;
}
.passphrase-display {
    background: var(--bg);
    border: 1px solid var(--text-muted);
    border-radius: var(--radius-md);
    padding: 1.2rem;
    font-family: var(--mono);
    font-size: 1.3rem;
    color: var(--accent-light);
    text-align: center;
    margin-bottom: 1.5rem;
    min-height: 4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    word-break: break-all;
    line-height: 1.5;
    user-select: all;
    cursor: pointer;
    transition: border-color 0.2s;
}
.passphrase-display:hover { border-color: var(--accent); }
.entropy-bar {
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    margin-top: 0.5rem;
    overflow: hidden;
}
.entropy-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
    transition: width 0.3s;
}
.entropy-info {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-top: 0.3rem;
}
.controls {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    margin-top: 1.5rem;
}
.control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
}
.control-row label { font-size: 0.85rem; color: var(--text-dim); }
.slider-wrap {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    flex: 1;
    max-width: 300px;
}
.slider-wrap input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    cursor: pointer;
}
.slider-val {
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--accent);
    min-width: 2rem;
    text-align: center;
}
.toggles {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
}
.toggle-wrap {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    cursor: pointer;
    font-size: 0.8rem;
    color: var(--text-dim);
}
.toggle-wrap input[type="checkbox"] {
    accent-color: var(--accent);
    width: 1rem;
    height: 1rem;
    cursor: pointer;
}
select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--text-muted);
    border-radius: var(--radius-sm);
    padding: 0.35rem 0.6rem;
    font-family: var(--font);
    font-size: 0.85rem;
    cursor: pointer;
}
select:focus { outline: none; border-color: var(--accent); }
.btns {
    display: flex;
    gap: 0.8rem;
    margin-top: 1rem;
}
.btn {
    flex: 1;
    padding: 0.75rem;
    background: var(--surface);
    border: 1px solid var(--text-muted);
    border-radius: var(--radius-sm);
    color: var(--text);
    cursor: pointer;
    font-family: var(--font);
    font-size: 0.9rem;
    transition: all 0.2s;
    text-align: center;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn-primary:hover { background: var(--accent-light); }
.copied-msg {
    text-align: center;
    color: var(--accent);
    font-size: 0.8rem;
    min-height: 1.5rem;
    margin-top: 0.5rem;
    opacity: 0;
    transition: opacity 0.3s;
}
.copied-msg.show { opacity: 1; }
footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--text-muted);
    font-size: 0.75rem;
    margin-top: auto;
}
footer a { color: var(--text-muted); text-decoration: none; }
footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="container">
<header>
    <h1>passphrase</h1>
    <p class="tagline">Diceware-style Passphrase Generator</p>
</header>
<div class="card">
    <div class="passphrase-display" id="passDisplay"></div>
    <div class="entropy-bar"><div class="entropy-bar-fill" id="entropyFill"></div></div>
    <div class="entropy-info">
        <span id="entropyBits">0 bits</span>
        <span id="entropyRating">—</span>
    </div>
    <div class="controls">
        <div class="control-row">
            <label>Words</label>
            <div class="slider-wrap">
                <input type="range" id="wordSlider" min="3" max="8" value="5" step="1">
                <span class="slider-val" id="wordSliderVal">5</span>
            </div>
        </div>
        <div class="control-row">
            <label>Options</label>
            <div class="toggles">
                <label class="toggle-wrap"><input type="checkbox" id="optCapitalize"> Capitalize</label>
                <label class="toggle-wrap"><input type="checkbox" id="optDigit"> +Digit</label>
                <label class="toggle-wrap"><input type="checkbox" id="optSpecial"> +Special</label>
            </div>
        </div>
        <div class="control-row">
            <label>Separator</label>
            <select id="separatorSelect">
                <option value=" ">Space</option>
                <option value="-">Hyphen</option>
                <option value=".">Dot</option>
                <option value="_">Underscore</option>
            </select>
        </div>
    </div>
    <div class="btns">
        <button class="btn btn-primary" id="genBtn">Generate</button>
        <button class="btn" id="anotherBtn">Another</button>
    </div>
    <div class="copied-msg" id="copiedMsg">✓ Copied to clipboard</div>
</div>
<footer>
    <a href="https://soumendrak.github.io/passphrase/">soumendrak — licensed under MIT</a>
</footer>
</div>

function getRandomInt(max) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
}

function generatePassphrase(numWords, capitalize, addDigit, addSpecial, separator) {
    const selected = [];
    for (let i = 0; i < numWords; i++) {
        let word = WORDS[getRandomInt(WORDS.length)];
        if (capitalize) word = word.charAt(0).toUpperCase() + word.slice(1);
        selected.push(word);
    }
    let phrase = selected.join(separator);
    if (addDigit) {
        const digit = getRandomInt(10).toString();
        const pos = getRandomInt(phrase.length + 1);
        phrase = phrase.slice(0, pos) + digit + phrase.slice(pos);
    }
    if (addSpecial) {
        const specials = '!@#$%^&*()_+-=[]{}|;:,.<>?';
        const ch = specials[getRandomInt(specials.length)];
        const pos = getRandomInt(phrase.length + 1);
        phrase = phrase.slice(0, pos) + ch + phrase.slice(pos);
    }
    return phrase;
}

const passDisplay = document.getElementById('passDisplay');
const wordSlider = document.getElementById('wordSlider');
const wordSliderVal = document.getElementById('wordSliderVal');
const optCapitalize = document.getElementById('optCapitalize');
const optDigit = document.getElementById('optDigit');
const optSpecial = document.getElementById('optSpecial');
const separatorSelect = document.getElementById('separatorSelect');
const genBtn = document.getElementById('genBtn');
const anotherBtn = document.getElementById('anotherBtn');
const entropyBits = document.getElementById('entropyBits');
const entropyRating = document.getElementById('entropyRating');
const entropyFill = document.getElementById('entropyFill');
const copiedMsg = document.getElementById('copiedMsg');

const WORD_ENTROPY = Math.log2(WORDS.length);

function updateEntropy(numWords, addDigit, addSpecial) {
    let bits = numWords * WORD_ENTROPY;
    if (addDigit) bits += Math.log2(10);
    if (addSpecial) bits += Math.log2(32);
    const formatted = bits.toFixed(1) + ' bits';
    entropyBits.textContent = formatted;
    const pct = Math.min(bits / 100 * 100, 100);
    entropyFill.style.width = pct + '%';
    let rating = '';
    if (bits < 30) rating = 'Weak';
    else if (bits < 40) rating = 'Fair';
    else if (bits < 50) rating = 'Good';
    else if (bits < 60) rating = 'Strong';
    else rating = 'Very Strong';
    entropyRating.textContent = rating;
}

function generateAndDisplay() {
    const num = parseInt(wordSlider.value);
    const cap = optCapitalize.checked;
    const digit = optDigit.checked;
    const special = optSpecial.checked;
    const sep = separatorSelect.value;
    const phrase = generatePassphrase(num, cap, digit, special, sep);
    passDisplay.textContent = phrase;
    updateEntropy(num, digit, special);
}

wordSlider.addEventListener('input', function() {
    wordSliderVal.textContent = this.value;
    generateAndDisplay();
});

genBtn.addEventListener('click', generateAndDisplay);
anotherBtn.addEventListener('click', generateAndDisplay);

passDisplay.addEventListener('click', function() {
    const text = this.textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
        copiedMsg.classList.add('show');
        setTimeout(() => copiedMsg.classList.remove('show'), 2000);
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        copiedMsg.classList.add('show');
        setTimeout(() => copiedMsg.classList.remove('show'), 2000);
    });
});

[optCapitalize, optDigit, optSpecial, separatorSelect].forEach(el => {
    el.addEventListener('change', generateAndDisplay);
});

generateAndDisplay();
})();
